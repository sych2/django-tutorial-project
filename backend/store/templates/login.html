{% extends 'base.html' %}


    {% block content %}

     <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Login</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Log in to your account</p>
                </div>
            </div>
        </header>
<br> <br>
        <div class ="container">
            <div>
                <centre>
                    <div class="col-8">

                        <form method="POST" action="{% url 'login' %}">
                            {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">username</label>
    <input  class="form-control"  placeholder="Enter your username" name =  "username">

  </div>
  <div class="mb-3">
    <label  class="form-label" >Password</label>
    <input  class="form-control" name = "password" placeholder="Enter your password">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Terms and conditions</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>


                    </div>
                </centre>
<br><br><br>
            </div>

        </div>
    {% endblock %}
