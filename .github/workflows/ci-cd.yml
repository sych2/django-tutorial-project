name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:

  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Set up Docker
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # 3. Build backend image
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t backend-image ./backend

      # ------------------------------------------------------------
      # 4. Install Trivy
      # ------------------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb stable main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # ------------------------------------------------------------
      # 5. Trivy Image Scan (SECURITY GATE)
      # ------------------------------------------------------------
      - name: Run Trivy vulnerability scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            backend-image

      # ------------------------------------------------------------
      # 6. Optional: Push image (only if scan passes)
      # ------------------------------------------------------------
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag backend-image ${{ secrets.DOCKER_USERNAME }}/backend-image:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-image:latest
