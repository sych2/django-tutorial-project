name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/backend-image

jobs:

  # ── 1. Code quality ──────────────────────────────────────────────
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Dependency audit
        run: npm audit --audit-level=high

  # ── 2. Test ──────────────────────────────────────────────────────
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # ── 3. Build + Trivy scan (security gate) ────────────────────────
  scan:
    name: Build + Trivy scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} ./backend

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      # Always produce a readable report (never blocks)
      - name: Trivy scan — report
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            $IMAGE_NAME:${{ github.sha }}
        continue-on-error: true

      # Hard gate — only on master, fails the job if vulns found
      - name: Trivy scan — security gate
        if: github.ref == 'refs/heads/master'
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            $IMAGE_NAME:${{ github.sha }}

  # ── 4. Push image (master only) ───────────────────────────────────
  push:
    name: Push image
    needs: scan
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} ./backend

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag and push
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ── 5. Deploy to staging (master only) ───────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging          # enables branch protection + manual approval
    steps:
      - uses: actions/checkout@v4

      # Option A — SSH deploy (swap for kubectl/render/fly as needed)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop backend || true
            docker rm backend   || true
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 3000:3000 \
              ${{ env.IMAGE_NAME }}:latest
